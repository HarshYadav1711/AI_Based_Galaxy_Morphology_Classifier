seed: 42
reproducibility:
  deterministic_cudnn: true

# null = auto-select CUDA if available, else CPU
device: null

logging:
  level: INFO

data:
  dir: data/galaxies
  train_split: 0.8
  image_size: 224
  batch_size: 32
  num_workers: 0

model:
  name: lightweight

training:
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  resume: null
  early_stopping:
    patience: 0
    min_delta: 0.0
    monitor: val_loss
  checkpoint:
    save_dir: checkpoints
    periodic_every_epochs: 10

scheduler:
  mode: min
  factor: 0.5
  patience: 5

outputs:
  dir: outputs
