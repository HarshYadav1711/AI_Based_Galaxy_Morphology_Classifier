seed: 42
reproducibility:
  deterministic_cudnn: true

device: null

logging:
  level: INFO

data:
  dir: data/galaxies
  train_split: 0.8
  image_size: 224
  batch_size: 32
  num_workers: 0
  quality:
    enabled: true
  augmentation:
    rotation_degrees: 180   # train-time RandomRotation(±); set 15 for milder aug

multitask:
  enabled: false          # use model.name: lightweight_multitask to train heads
  manifest_csv: null      # e.g. data/multitask_labels.csv — paths relative to data.dir
  loss_weights:
    merger: 0.5
    bar: 0.5
    asymmetry: 0.1
  name: lightweight
  pretrained: true

training:
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  resume: null
  loss:
    weighted: false
    label_smoothing: 0.0
  mixup:
    enabled: false
    alpha: 0.2
  early_stopping:
    patience: 0
    min_delta: 0.0
    monitor: val_loss
  checkpoint:
    save_dir: checkpoints
    periodic_every_epochs: 10

scheduler:
  type: plateau
  mode: min
  factor: 0.5
  patience: 5
  eta_min: 1.0e-6

experiment:
  enabled: false
  root: experiments
  slug: null

outputs:
  dir: outputs
